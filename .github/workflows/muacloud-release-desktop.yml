name: MuaCloud Desktop Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag. Leave empty to use v<package.json version>."
        required: false
        type: string
      prerelease:
        description: "Mark the GitHub Release as a prerelease."
        required: false
        default: false
        type: boolean
      sign_updates:
        description: "Use TAURI_PRIVATE_KEY/TAURI_KEY_PASSWORD secrets to sign updater artifacts."
        required: false
        default: false
        type: boolean
      telegram_upload:
        description: "Upload built installers to Telegram after each platform build."
        required: false
        default: false
        type: boolean
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

env:
  CARGO_INCREMENTAL: 0
  HUSKY: 0
  NODE_OPTIONS: "--max_old_space_size=4096"
  RUST_BACKTRACE: short

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: false

jobs:
  prepare-release:
    name: Prepare Release
    runs-on: ubuntu-latest
    outputs:
      prerelease: ${{ steps.meta.outputs.prerelease }}
      release_tag: ${{ steps.meta.outputs.release_tag }}
      sign_args: ${{ steps.meta.outputs.sign_args }}
      sign_updates: ${{ steps.meta.outputs.sign_updates }}
      telegram_upload: ${{ steps.meta.outputs.telegram_upload }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version: "24.16.0"

      - name: Resolve Release Metadata
        id: meta
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"

          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            RELEASE_TAG="${GITHUB_REF_NAME}"
          else
            RELEASE_TAG="${{ inputs.release_tag }}"
          fi

          if [ -z "$RELEASE_TAG" ]; then
            RELEASE_TAG="v${VERSION}"
          fi

          if [[ "$RELEASE_TAG" != v* ]]; then
            RELEASE_TAG="v${RELEASE_TAG}"
          fi

          PRERELEASE="${{ (github.event_name == 'workflow_dispatch' && inputs.prerelease) || contains(github.ref_name, '-rc') }}"
          SIGN_UPDATES="${{ github.event_name == 'workflow_dispatch' && inputs.sign_updates }}"
          TELEGRAM_UPLOAD="${{ github.event_name == 'workflow_dispatch' && inputs.telegram_upload }}"

          if [ "$SIGN_UPDATES" = "true" ]; then
            SIGN_ARGS=""
          else
            SIGN_ARGS="--no-sign"
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "sign_updates=$SIGN_UPDATES" >> "$GITHUB_OUTPUT"
          echo "sign_args=$SIGN_ARGS" >> "$GITHUB_OUTPUT"
          echo "telegram_upload=$TELEGRAM_UPLOAD" >> "$GITHUB_OUTPUT"

      - name: Create Draft Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRERELEASE: ${{ steps.meta.outputs.prerelease }}
          RELEASE_TAG: ${{ steps.meta.outputs.release_tag }}
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" \
              --draft=true \
              --prerelease="$PRERELEASE" \
              --title "MuaCloud $RELEASE_TAG" \
              --notes "Draft desktop release. Verify assets before manual distribution."
          else
            gh release create "$RELEASE_TAG" \
              --target "$GITHUB_SHA" \
              --draft \
              --prerelease="$PRERELEASE" \
              --title "MuaCloud $RELEASE_TAG" \
              --notes "Draft desktop release. Verify assets before manual distribution."
          fi

  build-desktop:
    name: Build ${{ matrix.label }}
    needs: prepare-release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
          - label: macOS Apple Silicon
            os: macos-latest
            target: aarch64-apple-darwin
          - label: macOS Intel
            os: macos-latest
            target: x86_64-apple-darwin

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95.0"
          targets: ${{ matrix.target }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: "muacloud-desktop-${{ matrix.os }}-${{ matrix.target }}"
          workspaces: |
            . -> target

      - name: Install x86 OpenSSL (macOS Intel only)
        if: matrix.target == 'x86_64-apple-darwin'
        shell: bash
        run: |
          arch -x86_64 brew install openssl@3
          echo "OPENSSL_DIR=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"
          echo "OPENSSL_INCLUDE_DIR=$(brew --prefix openssl@3)/include" >> "$GITHUB_ENV"
          echo "OPENSSL_LIB_DIR=$(brew --prefix openssl@3)/lib" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_PATH=$(brew --prefix openssl@3)/lib/pkgconfig" >> "$GITHUB_ENV"

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version: "24.16.0"
          cache: pnpm

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare Sidecars and Resources
        run: pnpm run prebuild ${{ matrix.target }}

      - name: Build and Upload Tauri Bundle
        uses: tauri-apps/tauri-action@v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        with:
          tagName: ${{ needs.prepare-release.outputs.release_tag }}
          releaseName: "MuaCloud ${{ needs.prepare-release.outputs.release_tag }}"
          releaseBody: "Draft desktop release. Verify assets before manual distribution."
          releaseDraft: true
          prerelease: ${{ needs.prepare-release.outputs.prerelease }}
          tauriScript: pnpm
          args: --target ${{ matrix.target }} ${{ needs.prepare-release.outputs.sign_args }}
          includeUpdaterJson: false

      - name: Upload Bundle to Telegram
        if: needs.prepare-release.outputs.telegram_upload == 'true'
        env:
          BUILD_LABEL: ${{ matrix.label }}
          RELEASE_TAG: ${{ needs.prepare-release.outputs.release_tag }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID_RELEASE }}
          TELEGRAM_UPLOAD_MAX_MB: ${{ vars.TELEGRAM_UPLOAD_MAX_MB || '50' }}
          VERSION: ${{ needs.prepare-release.outputs.version }}
        run: >
          node scripts/telegram-upload.mjs
          "target/${{ matrix.target }}/release/bundle/nsis/*setup*.exe"
          "target/${{ matrix.target }}/release/bundle/dmg/*.dmg"
