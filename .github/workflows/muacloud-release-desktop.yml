name: MuaCloud Desktop Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag. Leave empty to use v<package.json version>."
        required: false
        type: string
      prerelease:
        description: "Mark the GitHub Release as a prerelease."
        required: false
        default: false
        type: boolean
      sign_updates:
        description: "Use TAURI_PRIVATE_KEY/TAURI_KEY_PASSWORD secrets to sign updater artifacts."
        required: false
        default: false
        type: boolean
      telegram_upload:
        description: "Upload built installers to Telegram after each platform build."
        required: false
        default: false
        type: boolean
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

env:
  CARGO_INCREMENTAL: 0
  HUSKY: 0
  NODE_OPTIONS: "--max_old_space_size=4096"
  PUBLIC_RELEASE_REPOSITORY: restaurant8/muacloud-client-releases
  RUST_BACKTRACE: short

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: false

jobs:
  prepare-release:
    name: Prepare Release
    runs-on: ubuntu-latest
    outputs:
      prerelease: ${{ steps.meta.outputs.prerelease }}
      release_tag: ${{ steps.meta.outputs.release_tag }}
      sign_args: ${{ steps.meta.outputs.sign_args }}
      sign_updates: ${{ steps.meta.outputs.sign_updates }}
      telegram_upload: ${{ steps.meta.outputs.telegram_upload }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version: "24.16.0"

      - name: Resolve Release Metadata
        id: meta
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"

          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            RELEASE_TAG="${GITHUB_REF_NAME}"
          else
            RELEASE_TAG="${{ inputs.release_tag }}"
          fi

          if [ -z "$RELEASE_TAG" ]; then
            RELEASE_TAG="v${VERSION}"
          fi

          if [[ "$RELEASE_TAG" != v* ]]; then
            RELEASE_TAG="v${RELEASE_TAG}"
          fi

          PRERELEASE="${{ (github.event_name == 'workflow_dispatch' && inputs.prerelease) || contains(github.ref_name, '-rc') }}"
          SIGN_UPDATES="${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.sign_updates) }}"
          TELEGRAM_UPLOAD="${{ github.event_name == 'workflow_dispatch' && inputs.telegram_upload }}"

          if [ "$SIGN_UPDATES" = "true" ]; then
            SIGN_ARGS=""
          else
            SIGN_ARGS="--no-sign"
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "sign_updates=$SIGN_UPDATES" >> "$GITHUB_OUTPUT"
          echo "sign_args=$SIGN_ARGS" >> "$GITHUB_OUTPUT"
          echo "telegram_upload=$TELEGRAM_UPLOAD" >> "$GITHUB_OUTPUT"

      - name: Create Public Release
        env:
          GH_TOKEN: ${{ secrets.PUBLIC_RELEASE_TOKEN }}
          PRERELEASE: ${{ steps.meta.outputs.prerelease }}
          RELEASE_TAG: ${{ steps.meta.outputs.release_tag }}
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" --repo "$PUBLIC_RELEASE_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" \
              --repo "$PUBLIC_RELEASE_REPOSITORY" \
              --draft=false \
              --prerelease="$PRERELEASE" \
              --title "MuaCloud $RELEASE_TAG" \
              --notes "MuaCloud desktop release."
          else
            gh release create "$RELEASE_TAG" \
              --repo "$PUBLIC_RELEASE_REPOSITORY" \
              --prerelease="$PRERELEASE" \
              --title "MuaCloud $RELEASE_TAG" \
              --notes "MuaCloud desktop release."
          fi

  build-desktop:
    name: Build ${{ matrix.label }}
    needs: prepare-release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
          - label: macOS Apple Silicon
            os: macos-latest
            target: aarch64-apple-darwin
          - label: macOS Intel
            os: macos-latest
            target: x86_64-apple-darwin

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95.0"
          targets: ${{ matrix.target }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: "muacloud-desktop-${{ matrix.os }}-${{ matrix.target }}"
          workspaces: |
            . -> target

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version: "24.16.0"
          cache: pnpm

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare Sidecars and Resources
        run: pnpm run prebuild ${{ matrix.target }}

      - name: Build Tauri Bundle
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        run: pnpm tauri build --target ${{ matrix.target }} ${{ needs.prepare-release.outputs.sign_args }}

      - name: Upload Bundle to Public Release
        env:
          GH_TOKEN: ${{ secrets.PUBLIC_RELEASE_TOKEN }}
          RELEASE_TAG: ${{ needs.prepare-release.outputs.release_tag }}
        shell: bash
        run: |
          shopt -s nullglob
          assets=(
            "target/${{ matrix.target }}/release/bundle/nsis/"*.exe
            "target/${{ matrix.target }}/release/bundle/nsis/"*.exe.sig
            "target/${{ matrix.target }}/release/bundle/msi/"*.msi
            "target/${{ matrix.target }}/release/bundle/msi/"*.msi.sig
            "target/${{ matrix.target }}/release/bundle/dmg/"*.dmg
            "target/${{ matrix.target }}/release/bundle/dmg/"*.dmg.sig
            "target/${{ matrix.target }}/release/bundle/macos/"*.app.tar.gz
            "target/${{ matrix.target }}/release/bundle/macos/"*.app.tar.gz.sig
          )

          if [ "${#assets[@]}" -eq 0 ]; then
            echo "No bundle assets found for ${{ matrix.target }}" >&2
            exit 1
          fi

          gh release upload "$RELEASE_TAG" "${assets[@]}" \
            --repo "$PUBLIC_RELEASE_REPOSITORY" \
            --clobber

      - name: Upload Bundle to Telegram
        if: needs.prepare-release.outputs.telegram_upload == 'true'
        env:
          BUILD_LABEL: ${{ matrix.label }}
          RELEASE_TAG: ${{ needs.prepare-release.outputs.release_tag }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID_RELEASE }}
          TELEGRAM_UPLOAD_MAX_MB: ${{ vars.TELEGRAM_UPLOAD_MAX_MB || '50' }}
          VERSION: ${{ needs.prepare-release.outputs.version }}
        run: >
          node scripts/telegram-upload.mjs
          "target/${{ matrix.target }}/release/bundle/nsis/*setup*.exe"
          "target/${{ matrix.target }}/release/bundle/dmg/*.dmg"
