<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link
      rel="shortcut icon"
      href="./assets/image/muacloud-logo.svg"
      type="image/svg+xml"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MuaCloud</title>
    <script>
      ;(() => {
        try {
          const root = document.documentElement
          const initialMode = window.__MUACLOUD_INITIAL_THEME_MODE
          const cachedMode = localStorage.getItem('verge-theme-mode-cache')
          const mode =
            initialMode === 'light' || initialMode === 'dark'
              ? initialMode
              : cachedMode === 'light' || cachedMode === 'dark'
                ? cachedMode
                : 'system'
          const prefersDark = window.matchMedia?.(
            '(prefers-color-scheme: dark)',
          )?.matches
          root.dataset.theme =
            mode === 'dark' || (mode === 'system' && prefersDark)
              ? 'dark'
              : 'light'
        } catch {
          document.documentElement.dataset.theme = 'light'
        }
      })()
    </script>
    <style>
      :root {
        --bg-color: #f5f5f5;
        --text-color: #333;
        color-scheme: light;
      }

      :root[data-theme='dark'] {
        --bg-color: #2e303d;
        --text-color: #ffffff;
        color-scheme: dark;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        color: var(--text-color);
      }

      #root {
        width: 100%;
        height: 100%;
      }

      #initial-loading-overlay {
        position: fixed;
        inset: 0;
        background: var(--bg-color);
        z-index: 9999;
        transition: opacity 0.2s ease-out;
      }

      #initial-loading-overlay[data-hidden='true'] {
        opacity: 0;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="initial-loading-overlay"></div>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
